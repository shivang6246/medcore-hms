name: MedCore HMS CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: Unit Tests (pure Mockito — no external services)
  # Uses H2 in-memory DB via src/test/resources/application.properties
  # ─────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests (H2 in-memory DB)
        working-directory: backend
        run: mvn clean test -pl . --no-transfer-progress

  # ─────────────────────────────────────────────────────────
  # Job 2: Docker Build (only on success of unit tests)
  # ─────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t medcore-hms-backend:latest .

