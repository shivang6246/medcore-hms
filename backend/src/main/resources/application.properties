spring.application.name=hms

# ---- Server ----
server.port=8080

# ---- DataSource (PostgreSQL) ----
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require

spring.datasource.username=postgres.ozbsngqjujfxqvqnazmg

spring.datasource.password=Medcore@123

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP connection pool tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ---- JPA / Hibernate ----
# update: creates/alters tables on startup (safe for dev; use Flyway/Liquibase in prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Disable open-in-view to prevent N+1 lazy-loading issues
spring.jpa.open-in-view=false

# ---- Redis ----
spring.data.redis.host=localhost
spring.data.redis.port=6379

