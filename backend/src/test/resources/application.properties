# =============================================================
# MedCore HMS — Test Configuration (CI / Unit Tests)
# Overrides main application.properties for the test scope.
# Uses H2 in-memory DB; Redis and Mail are mocked via
# TestRedisConfig in src/test/java.
# =============================================================

spring.application.name=hms-test

# ---- DataSource: H2 in-memory (PostgreSQL compatibility mode) ----
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ---- Redis: point to localhost (TestRedisConfig provides a mock bean so no real connection needed) ----
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ---- Caching: use simple in-memory cache instead of Redis ----
spring.cache.type=simple

# ---- Mail: dummy SMTP config (TestRedisConfig provides a mock JavaMailSender) ----
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test
app.mail.from=test@test.com

# ---- JWT ----
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RpbmctcHVycG9zZXMtbG9uZ2Vub3VnaA==
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# ---- OTP ----
otp.expiration-minutes=15

# ---- Logging (quieter in tests) ----
logging.level.com.medcore=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Disable health indicators that require live connections (mocked in tests)
management.health.redis.enabled=false
management.health.mail.enabled=false

# ---- Allow test beans to override production beans ----
spring.main.allow-bean-definition-overriding=true
